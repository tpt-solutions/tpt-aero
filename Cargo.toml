[workspace]
resolver = "2"
members = [
    "crates/tpt-aero-core",
    "crates/tpt-aero-vlm",
    "crates/tpt-aero-panel",
    "crates/tpt-aero-rotor",
    "crates/tpt-aero-atmo",
    "crates/tpt-aero-stability",
    "crates/tpt-aero-verify",
    "crates/tpt-aero",
]
exclude = []

[workspace.package]
description = "tpt-aero — pure-Rust analytical aerodynamics and flight mechanics (VLM, panel methods, BEMT, atmosphere, stability derivatives)"
authors = ["TPT Solutions"]
edition = "2021"
rust-version = "1.84"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/tpt-solutions/tpt-aero"
repository = "https://github.com/tpt-solutions/tpt-aero"

[workspace.dependencies]
# In-house tpt-math substrate (MIT OR Apache-2.0, path deps into the sibling
# workspace). All linear solves are native: tpt-math-linalg-dense is a
# hand-rolled dense backend with from-scratch partial-pivot LU — no external
# solver crates, no C/C++ FFI.
tpt-math-numeric = { version = "0.1.0", path = "../tpt-math/crates/tpt-math-numeric", default-features = false }
tpt-math-linalg-dense = { version = "0.1.0", path = "../tpt-math/crates/tpt-math-linalg-dense", default-features = false }
tpt-math-units = { version = "0.1.0", path = "../tpt-math/crates/tpt-math-units", default-features = false }
tpt-math-autodiff-fwd = { version = "0.1.0", path = "../tpt-math/crates/tpt-math-autodiff-fwd", default-features = false }

tpt-aero-core = { version = "0.1.0", path = "crates/tpt-aero-core", default-features = false }
tpt-aero-vlm = { version = "0.1.0", path = "crates/tpt-aero-vlm", default-features = false }
tpt-aero-panel = { version = "0.1.0", path = "crates/tpt-aero-panel", default-features = false }
tpt-aero-rotor = { version = "0.1.0", path = "crates/tpt-aero-rotor", default-features = false }
tpt-aero-atmo = { version = "0.1.0", path = "crates/tpt-aero-atmo", default-features = false }
tpt-aero-stability = { version = "0.1.0", path = "crates/tpt-aero-stability", default-features = false }
tpt-aero-verify = { version = "0.1.0", path = "crates/tpt-aero-verify", default-features = false }

# Dev-only: property-based testing (MIT OR Apache-2.0). std is fine here —
# verification harnesses never run in no_std targets.
proptest = "1.5"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"
rust_2021_compatibility = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# `new` without `Default` is common for physics builders where a default
# geometry is meaningless; silence the pedantic subset we intentionally allow.
new_without_default = "allow"
needless_range_loop = "allow"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
debug = true
