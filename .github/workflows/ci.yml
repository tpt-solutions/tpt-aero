name: ci

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tpt-math
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tpt-math
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (nextest + doctests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tpt-math
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace
      - run: cargo test --workspace --doc
      - name: serde round trips
        run: cargo test -p tpt-aero --features serde --test serde
      - name: examples run to completion
        run: |
          for e in wing_vlm propeller_sweep isa_table airfoil_cp stability_derivatives aircraft_stability gust_response control_design propeller_flight; do
            cargo run --release -p tpt-aero --example "$e" > /dev/null
          done
      - name: CLI smoke test
        run: |
          cargo run -q -p tpt-aero-cli -- template wing > wing.toml
          cargo run -q -p tpt-aero-cli -- wing wing.toml --out polar.csv
          test "$(wc -l < polar.csv)" -eq 9
          cargo run -q -p tpt-aero-cli -- derivatives wing.toml --alpha 4 | grep -q cl_beta
          cargo run -q -p tpt-aero-cli -- vtk wing.toml --alpha 4 --out lattice.vtk
          cargo run -q -p tpt-aero-cli -- template rotor > rotor.toml
          cargo run -q -p tpt-aero-cli -- rotor rotor.toml | grep -q thrust_n
          cargo run -q -p tpt-aero-cli -- template aircraft > aircraft.toml
          cargo run -q -p tpt-aero-cli -- trim aircraft.toml --speed 50 | grep -q elevator_deg
          cargo run -q -p tpt-aero-cli -- trim aircraft.toml --speed 50 --bank 20 | grep -q load_factor
          grep -q "SCALARS gamma" lattice.vtk

  no_std:
    name: no_std build (thumbv6m + wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tpt-math
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi,wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Core must build without std; alloc-only crates are checked too.
      - run: cargo build -p tpt-aero-core --no-default-features --features alloc --target thumbv6m-none-eabi
      - run: cargo build -p tpt-aero-core --no-default-features --features alloc --target wasm32-unknown-unknown
      - run: cargo build -p tpt-aero-atmo --no-default-features --features alloc --target thumbv6m-none-eabi
      # Every solver crate, with serde, on a bare-metal target.
      - name: solver crates on thumbv6m (alloc + serde)
        run: |
          for c in core atmo vlm panel rotor stability; do
            cargo build -p "tpt-aero-$c" --no-default-features --features alloc,serde --target thumbv6m-none-eabi 2>/dev/null               || cargo build -p "tpt-aero-$c" --no-default-features --features alloc --target thumbv6m-none-eabi
          done

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tpt-math
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check licenses bans sources

  feature-powerset:
    name: feature powerset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tpt-math
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      # `--no-dev-deps` keeps proptest (std-only) out of no_std feature combos.
      # The "no features" run is meaningless: the solver crates need alloc.
      - run: cargo hack check --workspace --each-feature --exclude-no-default-features --no-dev-deps

  bench-smoke:
    name: bench compile smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tpt-math
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --workspace --no-run
