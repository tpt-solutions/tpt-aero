[package]
name = "tpt-aero-rotor"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Blade Element Momentum Theory: iterative induction solve, tip/hub loss models, skewed wake, dynamic inflow, propeller maps."
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/tpt-aero-rotor"
keywords = ["bemt", "propeller", "rotor", "aerodynamics", "no-std"]
categories = ["science", "aerospace", "no-std"]

[dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"], optional = true }
tpt-aero-core = { workspace = true }
tpt-math-numeric = { workspace = true }
tpt-math-linalg-dense = { workspace = true }

[features]
serde = ["alloc", "dep:serde", "tpt-aero-core/serde"]
default = ["std"]
std = ["tpt-aero-core/std", "tpt-math-numeric/std", "tpt-math-linalg-dense/std"]
alloc = ["tpt-aero-core/alloc", "tpt-math-numeric/alloc", "tpt-math-linalg-dense/alloc"]
libm = ["alloc", "tpt-aero-core/libm", "tpt-math-numeric/libm"]

[lints]
workspace = true
