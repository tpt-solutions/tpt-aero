readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tpt-aero-cli = { version = "0.1.0", path = "../tpt-aero-cli" }
wasm-bindgen = "0.2"

[lints]
workspace = true
