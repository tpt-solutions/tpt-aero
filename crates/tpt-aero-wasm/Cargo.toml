[package]
name = "tpt-aero-wasm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "WebAssembly bindings for tpt-aero: wing polars, trim, reports and the standard atmosphere in the browser."
repository.workspace = true
homepage.workspace = true
keywords = ["aerodynamics", "wasm", "uav", "drone", "propeller"]
