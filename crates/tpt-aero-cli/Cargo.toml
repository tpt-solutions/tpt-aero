[package]
name = "tpt-aero-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Command-line front end for tpt-aero: run wing VLM sweeps from TOML case files and export CSV."
readme = "README.md"
repository.workspace = true
homepage.workspace = true
keywords = ["aerodynamics", "vlm", "cli", "cfd"]
categories = ["science", "aerospace", "command-line-utilities"]

[[bin]]
name = "tpt-aero"
path = "src/main.rs"

[dependencies]
tpt-aero = { workspace = true }
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[lints]
workspace = true
