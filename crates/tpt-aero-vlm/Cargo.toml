[package]
name = "tpt-aero-vlm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Vortex Lattice Method: horseshoe vortices, AIC assembly, native linear solves, differentiable forces."
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/tpt-aero-vlm"
keywords = ["vlm", "aerodynamics", "vortex-lattice", "wing", "no-std"]
categories = ["science", "aerospace", "no-std"]

[dependencies]
tpt-aero-core = { workspace = true }
tpt-math-numeric = { workspace = true }
tpt-math-linalg-dense = { workspace = true }
tpt-math-autodiff-fwd = { workspace = true }

[features]
default = ["std"]
std = ["tpt-aero-core/std", "tpt-math-numeric/std", "tpt-math-linalg-dense/std", "tpt-math-autodiff-fwd/std"]
alloc = ["tpt-aero-core/alloc", "tpt-math-numeric/alloc", "tpt-math-linalg-dense/alloc", "tpt-math-autodiff-fwd/alloc"]
libm = ["tpt-aero-core/libm", "tpt-math-numeric/libm"]

[dev-dependencies]
# Dev-only; default features off keeps plotters/rayon out of the tree.
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "vlm"
harness = false

[lints]
workspace = true
