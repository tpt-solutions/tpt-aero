[package]
name = "tpt-aero"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Umbrella crate: feature-gated re-exports of the tpt-aero aerodynamics and flight mechanics stack."
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/tpt-aero"
keywords = ["aerodynamics", "vlm", "bemt", "flight-mechanics", "atmosphere"]
categories = ["science", "aerospace", "simulation"]

[dependencies]
tpt-aero-core = { workspace = true, optional = true }
tpt-aero-vlm = { workspace = true, optional = true }
tpt-aero-panel = { workspace = true, optional = true }
tpt-aero-rotor = { workspace = true, optional = true }
tpt-aero-atmo = { workspace = true, optional = true }
tpt-aero-stability = { workspace = true, optional = true }
tpt-aero-verify = { workspace = true, optional = true }

[features]
# Serialize/Deserialize on result and parameter types.
serde = [
    "tpt-aero-core?/serde",
    "tpt-aero-vlm?/serde",
    "tpt-aero-rotor?/serde",
    "tpt-aero-atmo?/serde",
    "tpt-aero-stability?/serde",
]
default = ["core", "vlm", "panel", "rotor", "atmo", "stability", "std"]
core = ["dep:tpt-aero-core", "tpt-aero-core/alloc"]
vlm = ["dep:tpt-aero-vlm", "tpt-aero-vlm/alloc"]
panel = ["dep:tpt-aero-panel", "tpt-aero-panel/alloc"]
rotor = ["dep:tpt-aero-rotor", "tpt-aero-rotor/alloc"]
atmo = ["dep:tpt-aero-atmo", "tpt-aero-atmo/alloc"]
stability = ["dep:tpt-aero-stability", "tpt-aero-stability/alloc"]
# Verification harnesses are opt-in (they pull the std-only proptest stack).
verify = ["dep:tpt-aero-verify", "tpt-aero-verify/std"]
std = [
    "tpt-aero-core?/std",
    "tpt-aero-vlm?/std",
    "tpt-aero-panel?/std",
    "tpt-aero-rotor?/std",
    "tpt-aero-atmo?/std",
    "tpt-aero-stability?/std",
]
alloc = [
    "tpt-aero-core?/alloc",
    "tpt-aero-vlm?/alloc",
    "tpt-aero-panel?/alloc",
    "tpt-aero-rotor?/alloc",
    "tpt-aero-atmo?/alloc",
    "tpt-aero-stability?/alloc",
]
libm = [
    "tpt-aero-core?/libm",
    "tpt-aero-vlm?/libm",
    "tpt-aero-panel?/libm",
    "tpt-aero-rotor?/libm",
    "tpt-aero-atmo?/libm",
    "tpt-aero-stability?/libm",
]

[dev-dependencies]
serde = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }

[lints]
workspace = true
