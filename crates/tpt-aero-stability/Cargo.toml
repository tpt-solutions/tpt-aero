[package]
name = "tpt-aero-stability"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Flight mechanics: finite-difference and analytical stability derivative extraction, control effectiveness, plant matrices."
readme = "README.md"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/tpt-aero-stability"
keywords = ["stability", "derivatives", "flight-mechanics", "flight-dynamics", "control-design"]
categories = ["science", "aerospace", "simulation"]

[dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"], optional = true }
tpt-aero-core = { workspace = true }
tpt-aero-vlm = { workspace = true }
tpt-aero-atmo = { workspace = true }
tpt-math-autodiff-fwd = { workspace = true }
tpt-math-numeric = { workspace = true }
tpt-math-linalg-dense = { workspace = true }

[features]
serde = ["alloc", "dep:serde", "tpt-aero-core/serde", "tpt-aero-vlm/serde", "tpt-aero-atmo/serde"]
default = ["std"]
std = ["tpt-aero-core/std", "tpt-aero-vlm/std", "tpt-aero-atmo/std", "tpt-math-autodiff-fwd/std", "tpt-math-numeric/std", "tpt-math-linalg-dense/std"]
alloc = ["tpt-aero-core/alloc", "tpt-aero-vlm/alloc", "tpt-aero-atmo/alloc", "tpt-math-autodiff-fwd/alloc", "tpt-math-numeric/alloc", "tpt-math-linalg-dense/alloc"]
libm = ["alloc", "tpt-aero-core/libm", "tpt-aero-vlm/libm", "tpt-aero-atmo/libm", "tpt-math-numeric/libm"]

[lints]
workspace = true
