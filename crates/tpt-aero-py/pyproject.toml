[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "tpt-aero"
description = "Pure-Rust aerodynamics and flight mechanics: VLM wings, BEMT rotors, trim and stability, from Python."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "TPT Solutions" }]
keywords = ["aerodynamics", "uav", "drone", "propeller", "vlm"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]

[tool.maturin]
features = ["extension-module"]
module-name = "tpt_aero"
