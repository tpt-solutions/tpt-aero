[package]
name = "tpt-aero-py"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Python bindings for tpt-aero: wing sweeps, trim, reports, rotors and the standard atmosphere, built with PyO3 and maturin."
repository.workspace = true
homepage.workspace = true
keywords = ["aerodynamics", "python", "uav", "drone", "propeller"]
categories = ["science", "aerospace"]
readme = "README.md"

[lib]
name = "tpt_aero"
crate-type = ["cdylib", "rlib"]
# Same module name as the umbrella library; skip its rustdoc so both can be documented.
doc = false

[features]
# Enabled by maturin when building the extension module. Off by default so
# `cargo check`/`cargo test` link against the Python library as usual.
extension-module = ["pyo3/extension-module"]

[dependencies]
tpt-aero-cli = { version = "0.1.0", path = "../tpt-aero-cli" }
pyo3 = { version = "0.29", features = ["abi3-py39"] }

[lints]
workspace = true
